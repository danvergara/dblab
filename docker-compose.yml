services:
  postgres:
    image: danvergara/sakila:postgres-18.4
    ports:
      - '5432:5432'
    networks:
      - dblab

  mysql:
    image: danvergara/sakila:mysql-8.4
    ports:
      - '3306:3306'
    networks:
      - dblab

  oracle:
    image: container-registry.oracle.com/database/free:latest
    environment:
      ORACLE_PWD: password
    ports:
      - '1521:1521'
    networks:
      - dblab

  mssql:
    image: danvergara/sakila:mssql-2025
    environment:
      MSSQL_SA_PASSWORD: 5@klkbN#ABC
      ACCEPT_EULA: Y
    ports:
      - '1433:1433'
    networks:
      - dblab

  dblab:
    build:
      context: .
      target: builder
    volumes:
      - ./:/src/app:z
    depends_on:
      - postgres
    environment:
      - DB_HOST=postgres
      - DB_USER=sakila
      - DB_PASSWORD=sakila
      - DB_NAME=sakila
      - DB_PORT=5432
      - DB_DRIVER=postgres
      - DB_SCHEMA=public
    networks:
      - dblab

  dblab-mysql:
    build:
      context: .
      target: builder
    volumes:
      - ./:/src/app:z
    depends_on:
      - mysql
    environment:
      - DB_HOST=mysql
      - DB_USER=sakila
      - DB_PASSWORD=sakila
      - DB_NAME=sakila
      - DB_PORT=3306
      - DB_DRIVER=mysql
    networks:
      - dblab

  dblab-sqlite3:
    build:
      context: .
      target: builder
    volumes:
      - ./:/src/app:z
    environment:
      - DB_NAME=pkg/client/sakila.db
      - DB_DRIVER=sqlite
    networks:
      - dblab

networks:
  dblab:
